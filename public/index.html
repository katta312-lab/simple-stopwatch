<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f0">
  <meta name="description" content="開始・停止・リセットだけの、シンプルで使いやすいストップウォッチ。スマートフォンにも対応。">
  <title>ストップウォッチ</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23243e36'/%3E%3Ccircle cx='32' cy='36' r='19' fill='none' stroke='%23d6f29c' stroke-width='4'/%3E%3Cpath d='M26 8h12M32 8v9M32 24v13l8 5' fill='none' stroke='%23d6f29c' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header><span class="mark" aria-hidden="true">◷</span><span>STOPWATCH</span></header>
  <main>
    <h1>ストップウォッチ</h1>
    <div class="status" role="status" id="status"><span class="dot" aria-hidden="true"></span><span id="status-text">準備完了</span></div>
    <section class="clock" aria-label="経過時間">
      <div class="time" role="timer" aria-live="off" aria-label="00時間00分00秒00" id="timer"><span id="hours">00</span><span class="colon">:</span><span id="minutes">00</span><span class="colon">:</span><span id="seconds">00</span><span class="fraction">.<span id="hundredths">00</span></span></div>
      <div class="units" aria-hidden="true">時 <span>／</span> 分 <span>／</span> 秒</div>
    </section>
    <div class="controls">
      <button class="primary" id="toggle"><span id="toggle-icon" aria-hidden="true">▶</span><span id="toggle-label">開始</span></button>
      <button class="secondary" id="reset" disabled><span aria-hidden="true">↺</span> リセット</button>
    </div>
    <p class="shortcut"><kbd>Space</kbd> 開始・停止 <span>·</span> <kbd>R</kbd> リセット</p>
  </main>
  <footer>ページを閉じる・再読み込みすると、計測はリセットされます。</footer>
</body>
</html>
